# Gradle daemon flags only -- version pins live in stonecutter.properties.toml, sectioned per
# version/loader and auto-loaded from the root, the tree, and each versions/<node>/ dir.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# Loom's mixin AP and the configuration cache are not yet mutually compatible on every leg here
# (fabric-loom issue 1349, same reasoning villager_voices/gradle.properties records).
org.gradle.configuration-cache=false
