# Centralised, version/loader-sectioned properties (Stonecutter's own mechanism), auto-loaded
# from the root, the tree, and each versions/<node>/ dir -- satisfies GV-2's "gradle/libs.versions
# .toml or per-node gradle.properties for versions" via Stonecutter's own idiomatic file instead
# of a hand-rolled equivalent. Every coordinate below was verified against its real Maven
# repository on 2026-09-20 (see docs/spec/contracts/platform-matrix.md "Per-row toolchain,
# verified").
mod.id = "grounded_villages"
mod.name = "Grounded Villages"
mod.group = "grounded_villages"
mod.version = "0.1.0"
mod.license = "MIT"

deps.fabric_loader = "0.19.5"
# Plain JUnit 5/Jupiter, shared by every node's own `src/test/java` (GV-9): the same pin
# `villager_voices`' own gradle/libs.versions.toml uses, so the fleet stays on one JUnit line.
deps.junit = "6.1.3"
# fabric-loom 1.17-SNAPSHOT (docs/spec/contracts/platform-matrix.md) -- verified present at
# maven.fabricmc.net 2026-09-20 (snapshot build 20, 2026-09-15). Read by loom-back-compat's own
# `loomx.loom_version` property to pick the correct Loom major per node internally.
loomx.loom_version = "1.17-SNAPSHOT"

["1.20.1"]
mod.mc_releases = ["1.20.1"]

[fabric."1.20.1"]
mod.mc_compat = "1.20.1"
deps.fabric_api = "0.92.12+1.20.1"

[forge."1.20.1"]
mod.mc_compat = "[1.20.1,1.20.2)"
deps.forge = "47.4.23"

["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
deps.fabric_api = "0.116.17+1.21.1"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21.1,1.21.2)"
deps.neoforge = "21.1.251"

["26.2"]
mod.mc_releases = ["26.2"]

[fabric."26.2"]
mod.mc_compat = "~26.2"
deps.fabric_api = "0.161.0+26.2"

[neoforge."26.2"]
mod.mc_compat = "[26.2,26.3)"
deps.neoforge = "26.2.0.88"
